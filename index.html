    <!-- KODE BARU UNTUK INDEX FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB6wbESXwG1x43GCNUTYfYQ-X5KksiLnzE",
            authDomain: "temukan-app-20b29.firebaseapp.com",
            projectId: "temukan-app-20b29",
            storageBucket: "temukan-app-20b29.firebasestorage.app",
            messagingSenderId: "964187120219",
            appId: "1:964187120219:web:3e62624f73ac896fd5957e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Fungsi Global agar bisa dipanggil dari form.js
        window.simpanBarangKeFirebase = async (dataBarang) => {
            try {
                await addDoc(collection(db, "laporan_barang"), dataBarang);
                alert('Laporan berhasil dikirim ke database Firebase!');
                return true;
            } catch (e) {
                console.error("Error: ", e);
                alert('Gagal mengirim laporan.');
                return false;
            }
        };

        // Tampilkan Data secara Real-time
        const q = query(collection(db, "laporan_barang"), orderBy("id", "desc"));
        const listBarangContainer = document.getElementById('listBarang');

        onSnapshot(q, (snapshot) => {
            listBarangContainer.innerHTML = '';
            if (snapshot.empty) {
                listBarangContainer.innerHTML = '<p style="text-align:center; color:#94a3b8;">Belum ada laporan barang.</p>';
                return;
            }
            
            snapshot.forEach((doc) => {
                const barang = doc.data();
                
                // Format Tampilan (Sama seperti sebelumnya)
                const tanggal = new Date(barang.id).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
                const imgContent = barang.foto ? `<img src="${barang.foto}" class="barang-img">` : `<div class="barang-img">📦</div>`;
                const statusClass = barang.status === 'Ditemukan' ? 'status-ditemukan' : 'status-proses';

                listBarangContainer.innerHTML += `
                    <div class="barang-item">
                        ${imgContent}
                        <div class="barang-info">
                            <h3>${barang.nama}</h3>
                            <p>${barang.deskripsi}</p>
                            <p><i class="fa-solid fa-location-dot"></i> ${barang.lokasi}</p>
                            <p><small>${tanggal}</small></p>
                        </div>
                        <span class="status ${statusClass}">${barang.status}</span>
                    </div>
                `;
            });
        });

        // Cek Login
        const authArea = document.getElementById('authArea');
        const formLaporSection = document.getElementById('lapor');
        const pesanLoginSection = document.getElementById('pesanLogin');
        const userEmail = localStorage.getItem('userEmail');

        if (userEmail) {
            authArea.innerHTML = `
                <span style="margin-right: 10px; font-weight: bold; color: #1a56db;">
                    <i class="fa-solid fa-user"></i> ${userEmail}
                </span>
                <button onclick="localStorage.removeItem('userEmail'); location.reload();" class="btn-login" style="background-color: #ef4444;">Logout</button>
            `;
            if(formLaporSection) formLaporSection.style.display = 'block';
            if(pesanLoginSection) pesanLoginSection.style.display = 'none';
        } else {
            if(formLaporSection) formLaporSection.style.display = 'none';
            if(pesanLoginSection) pesanLoginSection.style.display = 'block';
        }
    </script>
    <script src="js/form.js"></script>
