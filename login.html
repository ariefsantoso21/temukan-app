    <!-- KODE BARU UNTUK LOGIN FIREBASE -->
    <script type="module">
        // Import fungsi Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Konfigurasi Firebase Anda
        const firebaseConfig = {
            apiKey: "AIzaSyB6wbESXwG1x43GCNUTYfYQ-X5KksiLnzE",
            authDomain: "temukan-app-20b29.firebaseapp.com",
            projectId: "temukan-app-20b29",
            storageBucket: "temukan-app-20b29.firebasestorage.app",
            messagingSenderId: "964187120219",
            appId: "1:964187120219:web:3e62624f73ac896fd5957e"
        };

        // Inisialisasi Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // LOGIKA LOGIN
        document.getElementById('formLogin').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    // Simpan email untuk keperluan tampilan di halaman utama
                    localStorage.setItem('userEmail', user.email); 
                    alert(`Login berhasil! Selamat datang.`);
                    window.location.href = 'index.html';
                })
                .catch((error) => {
                    document.getElementById('loginError').innerText = "Email atau Password salah!";
                });
        });

        // LOGIKA DAFTAR
        document.getElementById('formRegister').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;

            try {
                // 1. Buat akun di Authentication
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 2. Simpan data nama ke Database Firestore
                await setDoc(doc(db, "users", user.uid), {
                    nama: name,
                    email: email,
                    role: "anggota" // Default role
                });

                alert('Pendaftaran berhasil! Silakan login.');
                if(typeof switchTab === 'function') switchTab('login');
            } catch (error) {
                alert('Gagal daftar: ' + error.message);
            }
        });
    </script>
